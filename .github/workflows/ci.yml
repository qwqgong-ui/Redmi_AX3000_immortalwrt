name: CI 25.12

on:
  workflow_dispatch:
  push:
    branches:
      - redmi_ax3000-25.12

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      ci_version: ${{ steps.hook_core.outputs.ci_version }}
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android

      - name: Install dependencies
        run: |
          sudo bash -c 'bash <(curl -s https://build-scripts.immortalwrt.org/init_build_environment.sh)'

      - name: Checkout
        uses: actions/checkout@v7

      - name: Hook the openwrt_core URL for opkg
        id: hook_core
        run: |
          set -euo pipefail
          OWNER="${GITHUB_REPOSITORY%%/*}"
          REPO="${GITHUB_REPOSITORY#*/}"
          RUN_META="$(curl -fsSL "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}")" || {
            echo "Failed to fetch workflow run metadata from GitHub API (repo=${GITHUB_REPOSITORY}, run=${GITHUB_RUN_ID})."
            exit 1
          }
          TIME="$(jq -er .created_at <<<"${RUN_META}")" || {
            echo "Invalid workflow run metadata: missing created_at."
            exit 1
          }
          CI_VERSION="ci-$(date -d "${TIME}" -u +'%Y%m%d-%H%M%S')-${GITHUB_SHA:0:8}"

          echo "ci_version=${CI_VERSION}" >>"$GITHUB_OUTPUT"
          grep -Fq '%U/targets/%S/packages' include/feeds.mk || {
            echo "Expected pattern '%U/targets/%S/packages' not found in include/feeds.mk."
            exit 1
          }
          sed -i "s|%U/targets/%S/packages|https://${OWNER}.github.io/${REPO}/${GITHUB_REF_NAME}/%R|" include/feeds.mk

      - name: Update feeds
        run: ./scripts/feeds update -a

      - name: Restore download cache
        uses: actions/cache@v6
        with:
          path: dl
          key: openwrt-25.12-dl-${{ hashFiles('feeds.conf.default', 'feeds/*.index', '**/Makefile') }}
          restore-keys: |
            openwrt-25.12-dl-

      - name: Install feeds
        run: ./scripts/feeds install -a

      - name: Configure
        run: |
          cat <<EOF | sed -E 's/^  //' >.config
            CONFIG_TARGET_qualcommax=y
            CONFIG_TARGET_qualcommax_ipq50xx=y
            CONFIG_TARGET_qualcommax_ipq50xx_DEVICE_redmi_ax3000=y

            CONFIG_IB=y
            # CONFIG_IB_STANDALONE is not set
            CONFIG_SDK=y
            CONFIG_MAKE_TOOLCHAIN=y

            CONFIG_ALL_NONSHARED=y
            CONFIG_REPRODUCIBLE_DEBUG_INFO=y
            CONFIG_CCACHE=y

            CONFIG_PACKAGE_luci=y
            CONFIG_PACKAGE_nss-wifi=y
            CONFIG_PACKAGE_kmod-qca-nss-drv=y
            CONFIG_PACKAGE_kmod-qca-nss-drv-bridge-mgr=y
            CONFIG_PACKAGE_kmod-qca-nss-drv-qdisc=y
            CONFIG_PACKAGE_kmod-qca-nss-drv-igs=y
            CONFIG_PACKAGE_kmod-qca-nss-drv-pppoe=y
            CONFIG_PACKAGE_tc-full=y
            CONFIG_PACKAGE_sqm-scripts-nss=y
            CONFIG_PACKAGE_luci-app-sqm=y
            CONFIG_PACKAGE_kmod-qca-nss-ecm=y
            CONFIG_PACKAGE_kmod-qca-dsa-nss=y
            CONFIG_PACKAGE_nss-firmware=y
            CONFIG_PACKAGE_nss-firmware-ipq50xx=y
            CONFIG_NSS_FIRMWARE_VERSION_12_2=y
            CONFIG_NSS_MEM_PROFILE_LOW=y
            CONFIG_NSS_DRV_WIFIOFFLOAD_ENABLE=y
            CONFIG_NSS_DRV_WIFI_EXT_VDEV_ENABLE=y
            CONFIG_NSS_DRV_VIRT_IF_ENABLE=y
            CONFIG_NSS_DRV_BRIDGE_ENABLE=y
            CONFIG_NSS_DRV_VLAN_ENABLE=y
            CONFIG_NSS_DRV_IPV6_ENABLE=y
            CONFIG_NSS_DRV_IPV4_REASM_ENABLE=y
            CONFIG_NSS_DRV_IPV6_REASM_ENABLE=y
            CONFIG_NSS_DRV_PPPOE_ENABLE=y
            CONFIG_NSS_DRV_SHAPER_ENABLE=y
            CONFIG_NSS_DRV_IGS_ENABLE=y
            # CONFIG_NSS_DRV_RMNET_ENABLE is not set
            CONFIG_ATH11K_NSS_SUPPORT=y
            CONFIG_ATH11K_MEM_PROFILE_256M=y
            CONFIG_PACKAGE_MAC80211_DEBUGFS=y
            CONFIG_PACKAGE_iw=y
          EOF
          make defconfig

      - name: Restore host and toolchain cache
        uses: actions/cache@v6
        with:
          path: |
            build_dir/host
            build_dir/hostpkg
            build_dir/toolchain-*
            staging_dir/host
            staging_dir/hostpkg
            staging_dir/toolchain-*
          key: openwrt-25.12-toolchain-${{ runner.os }}-${{ hashFiles('.config', 'rules.mk', 'include/**', 'tools/**', 'toolchain/**') }}
          restore-keys: |
            openwrt-25.12-toolchain-${{ runner.os }}-

      - name: Restore compiler cache
        uses: actions/cache@v6
        with:
          path: .ccache
          key: openwrt-25.12-ccache-${{ github.sha }}
          restore-keys: |
            openwrt-25.12-ccache-

      - name: Download
        run: make -j16 download

      - name: Build tools
        run: make -j$(nproc) tools/install V=sc

      - name: Build toolchain
        run: make -j$(nproc) toolchain/install V=sc

      - name: Build all
        run: make -j$(nproc) V=sc

      - name: Test NSS Wi-Fi, relay and DNS control paths
        run: |
          set -eu
          NSS_SOURCE="$(find build_dir -path '*/qca-nss-drv-*/nss_wifi_vdev.c' -print -quit)"
          ATH11K_MAC="$(find build_dir -path '*/backports-*/drivers/net/wireless/ath/ath11k/mac.c' -print -quit)"
          BRIDGE_SOURCE="$(find build_dir -path '*/qca-nss-clients-*/bridge/nss_bridge_mgr.c' -print -quit)"
          KERNEL_SOURCE="$(find build_dir -path '*/linux-6.12.*/net/netfilter/nf_conntrack_ecache.c' -print -quit)"
          DP_SOURCE="$(find build_dir -path '*/qca-nss-dp-*/nss_dp_attach.c' -print -quit)"
          ECM_SOURCE="$(find build_dir -path '*/qca-nss-ecm-*/ecm_interface.c' -print -quit)"
          DNS_FORWARD="$(find build_dir -path '*/dnsmasq-*/src/forward.c' -print -quit)"
          test -n "$NSS_SOURCE"
          test -n "$ATH11K_MAC"
          test -n "$BRIDGE_SOURCE"
          test -n "$KERNEL_SOURCE"
          test -n "$DP_SOURCE"
          test -n "$ECM_SOURCE"
          test -n "$DNS_FORWARD"
          UBSAN_OPTIONS=halt_on_error=1 python3 scripts/tests/test-dns-fast-retry.py \
            --source "$(dirname "$DNS_FORWARD")"
          python3 scripts/tests/test-nss-wifi.py "$(dirname "$NSS_SOURCE")" \
            "${ATH11K_MAC%/drivers/net/wireless/ath/ath11k/mac.c}"
          UBSAN_OPTIONS=halt_on_error=1 python3 scripts/tests/test-nss-qdisc-control.py \
            --driver "$(dirname "$NSS_SOURCE")"
          UBSAN_OPTIONS=halt_on_error=1 python3 scripts/tests/test-nss-wifi-qdisc.py \
            --driver "$(dirname "$NSS_SOURCE")"
          UBSAN_OPTIONS=halt_on_error=1 python3 scripts/tests/test-nss-wifi-next-hop.py \
            --driver "$(dirname "$NSS_SOURCE")"
          UBSAN_OPTIONS=halt_on_error=1 python3 scripts/tests/test-nss-ecm-denied.py \
            --ecm "$(dirname "$ECM_SOURCE")"
          python3 scripts/tests/test-nss-sqm-watch.py
          UBSAN_OPTIONS=halt_on_error=1 python3 scripts/tests/test-nss-qdisc-lifetime.py \
            --clients "$(dirname "$BRIDGE_SOURCE")/.."
          UBSAN_OPTIONS=halt_on_error=1 python3 scripts/tests/test-nss-qdisc-dma.py \
            --clients "$(dirname "$BRIDGE_SOURCE")/.."
          UBSAN_OPTIONS=halt_on_error=1 python3 scripts/tests/test-nss-stats-many-lifetime.py \
            --clients "$(dirname "$BRIDGE_SOURCE")/.."
          UBSAN_OPTIONS=halt_on_error=1 python3 scripts/tests/test-nss-mcbc.py \
            --backports "${ATH11K_MAC%/drivers/net/wireless/ath/ath11k/mac.c}"
          UBSAN_OPTIONS=halt_on_error=1 python3 scripts/tests/test-nss-mcbc-tid.py \
            --backports "${ATH11K_MAC%/drivers/net/wireless/ath/ath11k/mac.c}"
          UBSAN_OPTIONS=halt_on_error=1 python3 scripts/tests/test-nss-host-rings.py \
            --backports "${ATH11K_MAC%/drivers/net/wireless/ath/ath11k/mac.c}"
          UBSAN_OPTIONS=halt_on_error=1 python3 scripts/tests/test-reo-update-status.py \
            --backports "${ATH11K_MAC%/drivers/net/wireless/ath/ath11k/mac.c}"
          UBSAN_OPTIONS=halt_on_error=1 python3 scripts/tests/test-reo-command-lifetime.py \
            --backports "${ATH11K_MAC%/drivers/net/wireless/ath/ath11k/mac.c}"
          UBSAN_OPTIONS=halt_on_error=1 python3 scripts/tests/test-reo-queue-query.py \
            --backports "${ATH11K_MAC%/drivers/net/wireless/ath/ath11k/mac.c}"
          UBSAN_OPTIONS=halt_on_error=1 python3 scripts/tests/test-reo-pn-completion.py \
            --backports "${ATH11K_MAC%/drivers/net/wireless/ath/ath11k/mac.c}"
          UBSAN_OPTIONS=halt_on_error=1 python3 scripts/tests/test-reo-aging.py \
            --backports "${ATH11K_MAC%/drivers/net/wireless/ath/ath11k/mac.c}"
          UBSAN_OPTIONS=halt_on_error=1 python3 scripts/tests/test-nss-reo-notify.py \
            --backports "${ATH11K_MAC%/drivers/net/wireless/ath/ath11k/mac.c}" \
            --driver "$(dirname "$NSS_SOURCE")"
          UBSAN_OPTIONS=halt_on_error=1 python3 scripts/tests/test-nss-peer-create.py \
            --backports "${ATH11K_MAC%/drivers/net/wireless/ath/ath11k/mac.c}"
          UBSAN_OPTIONS=halt_on_error=1 python3 scripts/tests/test-nss-recovery.py \
            --backports "${ATH11K_MAC%/drivers/net/wireless/ath/ath11k/mac.c}"
          UBSAN_OPTIONS=halt_on_error=1 python3 scripts/tests/test-nss-shared-dma.py \
            --backports "${ATH11K_MAC%/drivers/net/wireless/ath/ath11k/mac.c}"
          UBSAN_OPTIONS=halt_on_error=1 python3 scripts/tests/test-nss-deferred-owners.py \
            --backports "${ATH11K_MAC%/drivers/net/wireless/ath/ath11k/mac.c}"
          UBSAN_OPTIONS=halt_on_error=1 python3 scripts/tests/test-nss-key.py \
            --backports "${ATH11K_MAC%/drivers/net/wireless/ath/ath11k/mac.c}"
          UBSAN_OPTIONS=halt_on_error=1 python3 scripts/tests/test-nss-key-ack.py \
            --backports "${ATH11K_MAC%/drivers/net/wireless/ath/ath11k/mac.c}"
          UBSAN_OPTIONS=halt_on_error=1 python3 scripts/tests/test-nss-key-tx.py \
            --backports "${ATH11K_MAC%/drivers/net/wireless/ath/ath11k/mac.c}"
          UBSAN_OPTIONS=halt_on_error=1 python3 scripts/tests/test-nss-vdev-format.py \
            --ath11k-source "$(dirname "$ATH11K_MAC")" \
            --nss-source "$(dirname "$NSS_SOURCE")"
          UBSAN_OPTIONS=halt_on_error=1 python3 scripts/tests/test-nss-monitor-metadata.py \
            --ath11k-source "$(dirname "$ATH11K_MAC")" \
            --kernel-source "${KERNEL_SOURCE%/net/netfilter/nf_conntrack_ecache.c}"
          UBSAN_OPTIONS=halt_on_error=1 python3 scripts/tests/test-nss-eap-route.py \
            --backports "${ATH11K_MAC%/drivers/net/wireless/ath/ath11k/mac.c}"
          UBSAN_OPTIONS=halt_on_error=1 python3 scripts/tests/test-wmi-key-lifetime.py \
            --backports "${ATH11K_MAC%/drivers/net/wireless/ath/ath11k/mac.c}"
          UBSAN_OPTIONS=halt_on_error=1 python3 scripts/tests/test-nss-vht-rate.py \
            --backports "${ATH11K_MAC%/drivers/net/wireless/ath/ath11k/mac.c}"
          UBSAN_OPTIONS=halt_on_error=1 python3 scripts/tests/test-nss-irq-stages.py \
            --backports "${ATH11K_MAC%/drivers/net/wireless/ath/ath11k/mac.c}"
          UBSAN_OPTIONS=halt_on_error=1 python3 scripts/tests/test-nss-quarantine.py \
            --drv "$(dirname "$NSS_SOURCE")" \
            --backports "${ATH11K_MAC%/drivers/net/wireless/ath/ath11k/mac.c}"
          UBSAN_OPTIONS=halt_on_error=1 python3 scripts/tests/test-nss-wifili.py \
            --drv "$(dirname "$NSS_SOURCE")"
          UBSAN_OPTIONS=halt_on_error=1 python3 scripts/tests/test-nss-control.py \
            --drv "$(dirname "$NSS_SOURCE")" \
            --backports "${ATH11K_MAC%/drivers/net/wireless/ath/ath11k/mac.c}"
          UBSAN_OPTIONS=halt_on_error=1 python3 scripts/tests/test-nss-n2h-sg.py \
            --drv "$(dirname "$NSS_SOURCE")"
          UBSAN_OPTIONS=halt_on_error=1 python3 scripts/tests/test-nss-me-control.py \
            --ath11k-source "$(dirname "$ATH11K_MAC")" \
            --nss-source "$(dirname "$NSS_SOURCE")"
          UBSAN_OPTIONS=halt_on_error=1 python3 scripts/tests/test-nss-bridge-ap.py \
            --clients-source "${BRIDGE_SOURCE%/bridge/nss_bridge_mgr.c}"
          UBSAN_OPTIONS=halt_on_error=1 python3 scripts/tests/test-nss-project.py \
            --drv "$(dirname "$NSS_SOURCE")"
          python3 scripts/tests/test-nss-relay.py \
            --clients "${BRIDGE_SOURCE%/bridge/nss_bridge_mgr.c}" \
            --backports "${ATH11K_MAC%/drivers/net/wireless/ath/ath11k/mac.c}" \
            --kernel "${KERNEL_SOURCE%/net/netfilter/nf_conntrack_ecache.c}"
          UBSAN_OPTIONS=halt_on_error=1 python3 scripts/tests/test-nss-lan.py \
            --drv "$(dirname "$NSS_SOURCE")" --dp "$(dirname "$DP_SOURCE")"
          UBSAN_OPTIONS=halt_on_error=1 python3 scripts/tests/test-nss-fdb.py \
            --kernel "${KERNEL_SOURCE%/net/netfilter/nf_conntrack_ecache.c}" \
            --ecm "$(dirname "$ECM_SOURCE")"
          UBSAN_OPTIONS=halt_on_error=1 python3 scripts/tests/test-nss-multicast.py \
            --kernel "${KERNEL_SOURCE%/net/netfilter/nf_conntrack_ecache.c}"
          UBSAN_OPTIONS=halt_on_error=1 python3 scripts/tests/test-nss-mdb.py \
            --kernel "${KERNEL_SOURCE%/net/netfilter/nf_conntrack_ecache.c}"
          UBSAN_OPTIONS=halt_on_error=1 python3 scripts/tests/test-nss-mcast-packet.py \
            --kernel "${KERNEL_SOURCE%/net/netfilter/nf_conntrack_ecache.c}"
          UBSAN_OPTIONS=halt_on_error=1 python3 scripts/tests/test-nss-ecm-bridge-contract.py \
            --kernel "${KERNEL_SOURCE%/net/netfilter/nf_conntrack_ecache.c}" \
            --ecm "$(dirname "$ECM_SOURCE")"
          UBSAN_OPTIONS=halt_on_error=1 python3 scripts/tests/test-nss-me-plan.py \
            --ath11k-source "$(dirname "$ATH11K_MAC")" \
            --kernel "${KERNEL_SOURCE%/net/netfilter/nf_conntrack_ecache.c}"
          UBSAN_OPTIONS=halt_on_error=1 python3 scripts/tests/test-nss-me-tx.py \
            --ath11k-source "$(dirname "$ATH11K_MAC")" \
            --kernel "${KERNEL_SOURCE%/net/netfilter/nf_conntrack_ecache.c}"
          UBSAN_OPTIONS=halt_on_error=1 python3 scripts/tests/test-nss-ecm-multicast.py \
            --ecm "$(dirname "$ECM_SOURCE")"
          UBSAN_OPTIONS=halt_on_error=1 python3 scripts/tests/test-nss-ecm-ap-fanout.py \
            --ecm "$(dirname "$ECM_SOURCE")"
          UBSAN_OPTIONS=halt_on_error=1 python3 scripts/tests/test-nss-mroute-table.py \
            --kernel "${KERNEL_SOURCE%/net/netfilter/nf_conntrack_ecache.c}"
          python3 scripts/tests/test-nss-lan-init.py

      - name: Upload bin to artifacts
        uses: actions/upload-artifact@v7
        with:
          name: bin-qualcommax-ipq50xx
          path: bin/targets/qualcommax/ipq50xx/*

      - name: Upload dl to artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dl
          path: dl/*

  gh-pages:
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout gh-pages
        uses: actions/checkout@v7
        with:
          path: gh-pages
          ref: gh-pages
          fetch-depth: 0

      - name: Configure the git user
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

      - name: Drop old versions
        run: |
          cd gh-pages
          readarray -t old_version < <(git log --format='%h' -- "${GITHUB_REF_NAME}" | tail -n +10)
          GIT_SEQUENCE_EDITOR="sed -i '1 i break'" git rebase --interactive --committer-date-is-author-date --root
          for commit in "${old_version[@]}"; do
            sed -i "/${commit}/d" .git/rebase-merge/git-rebase-todo
          done
          git rebase --continue

      - name: Download core packages from artifacts
        uses: actions/download-artifact@v8
        with:
          name: bin-qualcommax-ipq50xx
          path: bin/

      - name: Copy contents
        run: |
          version="$(cat "bin/version.buildinfo")"
          mkdir -p "gh-pages/${GITHUB_REF_NAME}/${version}/"
          cp -avr bin/packages/* "gh-pages/${GITHUB_REF_NAME}/${version}/"

      - name: Commit
        run: |
          cd gh-pages
          git add .
          git commit -m "Add: ${GITHUB_REF_NAME}: $(cat ../bin/version.buildinfo)"

      - name: Publish
        run: |
          cd gh-pages
          git push origin gh-pages -f

  release:
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download dl from artifacts
        uses: actions/download-artifact@v8
        with:
          name: dl
          path: dl/

      - name: Download bin from artifacts
        uses: actions/download-artifact@v8
        with:
          name: bin-qualcommax-ipq50xx
          path: bin/targets/qualcommax/ipq50xx/

      - name: Generate release information
        run: |
          TIME="$(curl -fsSL "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" | jq -r .created_at)"

          TAG="ci-${GITHUB_REF_NAME}-$(date -d "${TIME}" -u +'%Y%m%d-%H%M%S-%Z')"
          echo "TAG=$TAG" >>"$GITHUB_ENV"

          cat <<EOF | sed -E 's/^  //' >Release.md
            CI ${GITHUB_REF_NAME} $(date -d "${TIME}" -u +'%Y-%m-%d %H:%M:%S %Z(%:z)')

            # ${GITHUB_REF_NAME}

            Build time: \`$(date -d "${TIME}" -u +'%Y-%m-%d %H:%M:%S %Z(%:z)')\`
            Release version: ${TAG}

            ## Sources
            $(cat bin/targets/qualcommax/ipq50xx/feeds.buildinfo | awk -F'[ ^]' '{printf "%s: `%s`\n", $2, $4}')

            ## SHA256
            $(cat bin/targets/qualcommax/ipq50xx/sha256sums | awk '{printf "%s: `%s`\n", $2, $1}' | sed -E 's/^\*//')
          EOF

          echo "NAME=$(head --line=1 Release.md)" >>"$GITHUB_ENV"
          tail --line=+2 Release.md >Body.md

      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          prerelease: true
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: ${{ env.NAME }}
          body_path: Body.md
          files: |
            bin/targets/qualcommax/ipq50xx/sha256sums
            bin/targets/qualcommax/ipq50xx/*.*
