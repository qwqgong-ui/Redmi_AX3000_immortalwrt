name: Build ath11k kmod

on:
  workflow_dispatch:
  push:
    branches:
      - agent/ath11k-kmod-artifact

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android

      - name: Install dependencies
        run: |
          sudo bash -c 'bash <(curl -s https://build-scripts.immortalwrt.org/init_build_environment.sh)'

      - name: Checkout
        uses: actions/checkout@v6

      - name: Update and install feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure target and ath11k only
        run: |
          cat <<EOF | sed -E 's/^  //' >.config
            CONFIG_TARGET_qualcommax=y
            CONFIG_TARGET_qualcommax_ipq50xx=y
            CONFIG_TARGET_qualcommax_ipq50xx_DEVICE_redmi_ax3000=y
            CONFIG_PACKAGE_kmod-ath11k=y
            CONFIG_PACKAGE_kmod-ath11k-ahb=y
          EOF
          make defconfig

      - name: Download
        run: |
          make -j16 download

      - name: Build tools
        run: |
          make -j$(nproc) tools/install V=sc

      - name: Build toolchain
        run: |
          make -j$(nproc) toolchain/install V=sc

      - name: Build target kernel
        run: |
          make -j$(nproc) target/linux/compile V=sc

      - name: Build mac80211 package
        run: |
          make -j$(nproc) package/kernel/mac80211/compile V=sc

      - name: Verify kmod package exists
        run: |
          shopt -s nullglob
          packages=(bin/targets/qualcommax/ipq50xx/packages/kmod-ath11k_*.ipk)
          ((${#packages[@]} == 1)) || {
            printf 'Expected one kmod-ath11k package, found %d\n' "${#packages[@]}"
            find bin -type f -name 'kmod-ath11k*' -print || true
            exit 1
          }
          printf '%s\n' "${packages[@]}"

      - name: Upload kmod-ath11k
        uses: actions/upload-artifact@v7
        with:
          name: kmod-ath11k-qualcommax-ipq50xx
          path: bin/targets/qualcommax/ipq50xx/packages/kmod-ath11k_*.ipk
          if-no-files-found: error
